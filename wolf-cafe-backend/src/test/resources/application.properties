# Each ${NAME:default} reads an environment variable and falls back to the value
# after the colon when it is not set.  A freshly cloned repository therefore runs
# against a local MySQL with no editing, and CI supplies its own host and password
# through the environment rather than rewriting this file.
#
# Note the separate wolfcafe_test schema: running the tests must never touch
# the data you are working with in the running application.

# Optional per-developer overrides.  See .env.template.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=wolf-cafe
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/wolfcafe_test?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Close the JPA session at the end of the service call rather than holding it
# open until the HTTP response is rendered.  Leaving it open (the Spring Boot
# default) lets a controller or a JSON serializer trigger extra queries after
# the service layer thinks it is finished, which hides where the queries come
# from.  Spring Boot warns about this on every start-up when it is left on.
spring.jpa.open-in-view=false

# Key used to sign the JSON Web Tokens handed out at login.  It is a Base64 string
# of at least 32 bytes.  The default is for local development only - anyone who
# knows it can forge a login token, so a deployed WolfCafe must set JWT_SECRET.
app.jwt-secret=${JWT_SECRET:I8qVEq78bQcxpM3OkKa3+QRxs9R0u+qRua4M3nvwohiLShHQLbOg6gBH4tnU7XZr}
# How long a login token stays valid, in milliseconds - 7 days.
app.jwt-expiration-milliseconds=604800000

# Plain text password for the default "admin" user that SetupDataLoader creates
# on the first start-up.  It is only read when that user does not exist yet, so
# changing it later does not change an existing admin's password.
app.admin-user-password=${ADMIN_PASSWORD:admin}
